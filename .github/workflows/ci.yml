name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Get Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Node environment (The Robot needs Node installed to run tests)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # 3. Install Backend Dependencies
    - name: Install Backend Deps
      run: |
        cd backend
        npm install

    # 4. Run Tests (The New Quality Gate)
    - name: Run Backend Tests
      run: |
        cd backend
        npm test

    # 5. Build Containers (Only runs if Step 4 passes)
    - name: Build Backend Docker Image
      run: |
        cd backend
        docker build -t expense-tracker-api .

    - name: Build Frontend Docker Image
      run: |
        cd frontend
        docker build -t expense-tracker-web .