name: CI/CD - Build, Test & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Node for Testing
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # 3. Run Backend Tests
    - name: Install & Test Backend
      run: |
        cd backend
        npm install
        npm test

    # 4. Login to Docker Hub (NEW)
    # Only runs if tests passed. Uses the secrets you just created.
    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Build and Push Backend (NEW)
    - name: Build & Push Backend
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        # Replace 'yourusername' with your actual Docker Hub username in the next line!
        tags: ${{ secrets.DOCKER_USERNAME }}/smart-expense-tracker-api:latest

    # 6. Build and Push Frontend (NEW)
    - name: Build & Push Frontend
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        # Replace 'yourusername' with your actual Docker Hub username!
        tags: ${{ secrets.DOCKER_USERNAME }}/smart-expense-tracker-web:latest