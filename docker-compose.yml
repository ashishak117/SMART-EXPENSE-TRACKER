services:

  mongo:
    image: mongo:6.0
    container_name: expense_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - expense_network

  api:
    build: ./backend
    container_name: expense_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/expense_tracker
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - expense_network

  web:
    build: ./frontend
    container_name: expense_web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - expense_network

volumes:
  mongo_data:

networks:
  expense_network:
    driver: bridge
